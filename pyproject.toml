[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pytorch-trt-cudnn-bridge"
version = "0.1.0"
authors = [
  { name="ProgramaGrueso", email="juanganoza@hotmail.com" },
]
description = "A lightweight loader to allow TensorRT 8.6 plugins (cuDNN 8) to coexist with PyTorch 2.x (cuDNN 9) on Linux"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.urls]
"Homepage" = "https://github.com/ProgramaGrueso/pytorch-trt-cudnn-bridge"
"Bug Tracker" = "https://github.com/ProgramaGrueso/pytorch-trt-cudnn-bridge/issues"
